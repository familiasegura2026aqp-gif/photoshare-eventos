<main class="shell guest-shell">
  <section class="intro">
    <p class="eyebrow">PhotoShare</p>
    <h1>Elige tu evento</h1>
    <p>
      Comparte fotos y videos desde tu celular.
    </p>
  </section>

  <section class="events guest-events">
    @if (events().length) {
      <div class="event-list">
        @for (event of events(); track event.id) {
          <a class="event-card" [routerLink]="['/event', event.code]">
            <div>
              <span class="event-name">{{ event.name }}</span>
              <small>{{ event.photoCount }} archivos</small>
            </div>
            <span class="event-enter">Entrar</span>
          </a>
        }
      </div>
    } @else {
      <p class="empty">Aun no hay eventos disponibles.</p>
    }
  </section>
</main>
