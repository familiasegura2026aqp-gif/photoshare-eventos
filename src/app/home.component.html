<main class="shell guest-shell">
  <section class="intro">
    <p class="eyebrow">PhotoShare para invitados</p>
    <h1>Escanea el QR o entra con el codigo del evento.</h1>
    <p>
      Sube tus fotos desde el celular y miralas junto con las de todos los invitados.
    </p>
  </section>

  <section class="panel">
    <form (ngSubmit)="enterEvent()" class="creator">
      <label for="eventCode">Codigo del evento</label>
      <div class="row">
        <input
          id="eventCode"
          name="eventCode"
          type="text"
          placeholder="Ej. PROMO2027ABCD"
          autocomplete="off"
          [ngModel]="eventCode()"
          (ngModelChange)="eventCode.set($event)"
        />
        <button type="submit">Entrar</button>
      </div>
    </form>
  </section>

  <section class="events guest-help">
    <h2>Para organizadores</h2>
    <p class="empty">Crea el evento, genera el QR y comparte el enlace con tus invitados.</p>
    <a routerLink="/admin">Crear o ver eventos</a>
  </section>
</main>
